<!DOCTYPE html>
<html lang="de">
    <head>
</head>        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex">
        <title></title>Seite nicht gefunden / Page not found | Open Podcast</title>
        <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
        <link rel="stylesheet" href="/css/tailwind/tailwind.min.css">
    </head>
    <body class="antialiased bg-white text-gray-900 font-body">
        <main class="container px-4 py-24 mx-auto max-w-3xl">
            <a href="/" aria-label="Open Podcast Startseite"><img class="w-44 mb-12" src="/images/logo.svg" alt="Open Podcast"></a>
            <p class="text-blue-600 font-bold mb-4">404</p>
            <h1 class="text-3xl md:text-4xl font-bold mb-6">Diese Seite wurde nicht gefunden.</h1>
            <p class="text-gray-600 mb-6">Die Adresse ist möglicherweise veraltet oder enthält einen Tippfehler.</p>
            <a class="font-semibold text-blue-600 underline" href="/">Zur deutschen Startseite</a>
            <section class="mt-12" lang="en" aria-labelledby="english-heading">
                <h2 id="english-heading" class="text-2xl font-bold mb-4">Page not found</h2>
                <p class="text-gray-600 mb-6">The address may be outdated or contain a typo.</p>
                <a class="font-semibold text-blue-600 underline" href="/en/">Go to the English homepage</a>
            </section>
        </main>
    </body>
</html>
